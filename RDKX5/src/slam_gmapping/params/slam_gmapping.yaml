/slam_gmapping:
  ros__parameters:
    # ── 帧定义 ──
    base_frame: base_footprint
    map_frame: map
    odom_frame: odom

    # ── 消息过滤器 ──
    queue_size: 100             # TF消息过滤器队列 (默认10太小, 易丢帧)
    throttle_scans: 1           # 扫描节流 (1=不丢帧)

    # ── 扫描匹配精度 ──
    particles: 30               # 粒子数 (80→30, 降低CPU, 轮式里程计够用)
    iterations: 5               # 扫描匹配迭代 (10→5)
    minimum_score: 50.0         # 最小匹配分数 (0→50, 拒绝低质量匹配)
    lsigma: 0.075
    ogain: 3.0
    lskip: 0
    kernelSize: 1
    delta: 0.05
    sigma: 0.05
    lstep: 0.05
    astep: 0.05

    # ── 运动模型噪声 (里程计不准时调大) ──
    srr: 0.1                    # 平移噪声(平移→平移)
    srt: 0.2                    # 平移噪声(平移→旋转)
    str: 0.1                    # 旋转噪声(旋转→平移)
    stt: 0.2                    # 旋转噪声(旋转→旋转)

    # ── 更新频率 ──
    linearUpdate: 0.1           # 每0.1m移动更新 (避免odom跳跃过大)
    angularUpdate: 0.1          # 每0.1rad旋转更新
    temporalUpdate: 0.1         # 最小更新间隔 (高频处理, 防丢帧)
    map_update_interval: 1.0    # 地图发布间隔
    transform_publish_period: 0.05

    # ── 激光参数 ──
    maxRange: 6.0               # 最大使用距离
    maxUrange: 4.0              # 可靠使用距离
    lasamplerange: 0.005
    lasamplestep: 0.005
    llsamplerange: 0.01
    llsamplestep: 0.01

    # ── 其他 ──
    occ_thresh: 0.25
    resampleThreshold: 0.5
    use_sim_time: false
    xmax: 20.0
    xmin: -20.0
    ymax: 20.0
    ymin: -20.0

    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_all
          reliability: reliable
      /tf:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
