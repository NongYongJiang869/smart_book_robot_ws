stm32_bridge:
  ros__parameters:
    # ── 串口配置 ──
    serial_port: "/dev/ttyS1"      # RDK X5 ↔ STM32 通信串口 (已确认)
    baud_rate: 115200              # 波特率

    # ── 运动学标定参数 (需实测标定) ──
    wheel_circumference: 0.478     # 轮子周长 (m)
    wheel_base: 0.35               # 左右轮间距 (m)
    counts_per_rev: 1560           # 编码器每圈脉冲数 (4倍频后)

    # ── 限速 ──
    max_linear_vel: 0.5            # 最大线速度 (m/s)
    max_angular_vel: 1.0           # 最大角速度 (rad/s)

    # ── 超时保护 ──
    cmd_timeout_ms: 200            # /cmd_vel 超时 → 自动零速

    # ── TF 帧名 ──
    odom_frame: "odom"
    base_frame: "base_link"

    # ── 电机补偿 ──
    right_motor_ratio_fwd: 1.08   # 前进: 右轮转速比补偿
    rev_comp_angular: 0.2         # 倒车: 固定右转补偿 rad/s (基准0.3m/s, 速度等比缩放)

    # ── 发布/指令频率 ──
    publish_rate: 50.0             # 主循环+里程计发布 (Hz)
    cmd_rate: 100.0                # 速度指令发送 (Hz)
